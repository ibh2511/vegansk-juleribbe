<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#5e0f16">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/side.css">
<script src="assets/config.js"></script><script src="assets/api.js"></script>
<script src="assets/vipps.js?v=2"></script><script src="assets/qrcode.min.js"></script>
<title>Takk for kjøpet</title>
<style>
/* Betalingsboksen for Vipps privat */
.betal{text-align:left}
.betal .eyebrow{display:block;text-align:center;color:var(--red);font-weight:700;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase}
.betal h1{text-align:center;margin:6px 0 4px}
.betal .ingress{text-align:center;margin-bottom:18px}
.trinn{list-style:none;display:grid;gap:12px;margin:0}
.trinn li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.trinn .nr{width:34px;height:34px;border-radius:50%;background:var(--red);color:var(--cream);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:16px}
.trinn li.enkel{grid-template-columns:1fr}
.trinn b{display:block;color:var(--ink);font-size:17px;line-height:1.3;margin-top:5px}
.trinn small{display:block;color:var(--muted);font-size:14.5px;line-height:1.45;margin-top:4px}
.tlf{font-family:"Playfair Display",Georgia,serif;font-size:26px;font-weight:700;letter-spacing:.04em;color:var(--ink)}
.knapp-liten{font:inherit;font-weight:700;font-size:15px;border:1.5px solid var(--green);color:var(--green);background:#fff;border-radius:999px;padding:7px 16px;cursor:pointer;min-height:40px}
.knapp-liten.ok{background:var(--green);color:var(--cream)}
.btn.vipps{background:var(--vipps);width:100%;margin-top:10px;box-shadow:0 6px 18px rgba(255,91,36,.3)}
/* Steg 1 på mobil er bare «Åpne Vipps». Rett under, midtstilt, står «Åpnet ikke Vipps?», som selv er lenken
   som prøver Vipps på en annen måte. */
.trinn li.knapp .btn.vipps{margin-top:0}
.trinn li.knapp .nr{margin-top:11px}
.trinn .under-knapp{margin:10px 0 0;text-align:center;font-size:14.5px;line-height:1.6;color:var(--muted)}
.trinn .under-knapp .reserve{color:var(--muted)}
/* Steg 2: nummeret og «Kopier» samlet i et felt, for den som må lime inn nummeret selv. Er det for smalt
   til at de står ved siden av hverandre (320 px), står de over hverandre. */
.felt{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 8px;margin-top:10px;padding:5px 5px 5px 12px;background:var(--paper);border:1px solid var(--line);border-radius:10px}
.felt .tlf{font-size:19px}
.felt .knapp-liten{min-height:34px;padding:4px 14px;font-size:14px;border-color:transparent;background:rgba(31,61,43,.09)}
.felt .knapp-liten.ok{background:var(--green);color:var(--cream)}
@media(max-width:359px){.felt{justify-content:flex-start;padding:8px 12px}}
/* PC: nummer og beløp under QR-koden, som to rader */
.fakta{margin:8px 0 0}
.fakta>div{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;min-height:54px;padding:6px 0;border-top:1px solid var(--line)}
.fakta>div:first-child{border-top:0}
.fakta dt{color:var(--muted);font-size:15px}
.fakta dd{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0;font-family:"Playfair Display",Georgia,serif;font-size:24px;font-weight:700;color:var(--ink)}
.fakta .tlf{font-size:24px}
.qr{display:grid;grid-template-columns:180px 1fr;gap:18px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.qr svg{width:180px;height:180px;display:block}
.qr b{display:block;font-size:18px;color:var(--ink);line-height:1.3}
@media(max-width:520px){.qr{grid-template-columns:1fr;justify-items:center;text-align:center}}
.fra{margin-top:0!important;font-size:15px;text-align:center}
/* Navnet i introteksten («Betal fra Vipps-kontoen til …») */
.betal .ingress b{color:var(--ink)}
/* «Betaler du fra en annens Vipps?» folder ut navnefeltet. Pilen viser at noe åpner seg, og snur når det er åpent. */
.fra .annen{display:block;width:fit-content;max-width:100%;margin:12px auto 0;padding:2px 8px;border:0;background:none;color:var(--muted);font:inherit;font-size:15px;line-height:1.6;text-align:center;text-wrap:balance;cursor:pointer}
/* Pilen står rett etter teksten, også når teksten deler seg på smale skjermer */
.fra .annen::after{content:"";position:relative;top:-3px;display:inline-block;width:7px;height:7px;margin-left:10px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);transition:transform .2s ease,top .2s ease}
.fra .annen[aria-expanded="true"]::after{top:1px;transform:rotate(-135deg)}
@media(hover:hover){.fra .annen:hover{color:var(--ink)}}
.fra .annen:focus:not(:focus-visible){outline:none}
@media (prefers-reduced-motion:reduce){.fra .annen::after{transition:none}}
/* Nederst under stegene: en prikk som pulserer, så det synes at siden ser etter betalingen. Etter 5 minutter
   står det «Venter fortsatt på betalingen». */
.betal .venter{display:flex;align-items:center;justify-content:center;gap:12px;margin:16px 0 0;font-size:14px;letter-spacing:.02em;color:var(--muted)}
.venter-prikk{position:relative;flex:none;width:10px;height:10px}
.venter-prikk::before,.venter-prikk::after{content:"";position:absolute;border-radius:50%}
.venter-prikk::before{inset:0;background:var(--vipps);box-shadow:0 0 6px rgba(255,91,36,.55);animation:prikk 2.4s ease-in-out infinite}
.venter-prikk::after{inset:-7px;border:2px solid rgba(255,91,36,.8);opacity:0;animation:radar 2.4s cubic-bezier(.2,.6,.35,1) infinite}
@keyframes prikk{0%,45%,100%{transform:scale(1);box-shadow:0 0 6px rgba(255,91,36,.55)}14%{transform:scale(1.3);box-shadow:0 0 10px rgba(255,91,36,.9)}}
@media (prefers-reduced-motion:reduce){.venter-prikk::before{animation:none}.venter-prikk::after{animation:none;opacity:.35;transform:scale(.8)}}
.nytt-navn{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.nytt-navn .btn{margin-top:0;min-height:46px;font-size:16px;padding:10px 18px}
.liten-feil{color:var(--red-dark);font-size:14px;text-align:center;margin-top:8px}
/* «Vi ser etter betalingen din»: radar, kort med det vi ser etter, og «Vis betalingen» nederst */
.sjekker{text-align:center}
.sjekker h1{text-wrap:balance}
.sjekker .ingress{margin-bottom:16px}
.radar{position:relative;width:76px;height:76px;margin:14px auto 8px}
.radar::before,.radar::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,91,36,.6);opacity:0;animation:radar 2.4s cubic-bezier(.2,.6,.35,1) infinite}
.radar::after{animation-delay:1.2s}
.radar span{position:absolute;inset:25px;border-radius:50%;background:var(--vipps);box-shadow:0 0 0 6px rgba(255,91,36,.15),0 6px 18px rgba(255,91,36,.3)}
@keyframes radar{0%{transform:scale(.35);opacity:.9}80%,100%{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.radar::before{animation:none;opacity:.35;transform:scale(.8)}.radar::after{display:none}}
.vente-kort{background:#fff;border:1px solid var(--line);border-radius:14px;padding:2px 16px;margin:0;text-align:left}
.vente-kort dd{flex:1 1 0%;min-width:0;justify-content:flex-end;text-align:right;font-size:20px}
.vente-kort #venteNavn{overflow-wrap:anywhere}
.vente-kort .knapp-liten{font-family:"Source Sans 3",system-ui,sans-serif;font-size:14px;min-height:36px;padding:5px 14px}
.vente-kort .knapp-liten[aria-expanded="true"]{background:var(--cream)}
.vente-tekst{color:var(--muted);font-size:14.5px;line-height:1.5;margin-top:14px;text-align:center;text-wrap:pretty}
.nowrap{white-space:nowrap}
/* Etter 20 minutter: en rolig hjelpeboks, i samme dempede stil som teksten over, med en kort overskrift */
.vente-hjelp{background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:18px;font-size:14px;line-height:1.55;color:var(--muted);text-align:left;text-wrap:pretty}
.vente-hjelp b{display:block;margin-bottom:4px;color:var(--ink)}
/* Spørsmålet på én linje og lenken på linjen under */
.tilbake-rad{margin-top:28px!important;text-align:center;color:var(--muted);font-size:15px;line-height:1.6}
.lenkeknapp{background:none;border:0;color:var(--red);text-decoration:underline;cursor:pointer;font:inherit;padding:0}
</style>
</head>
<body>
<div class="band" aria-hidden="true"></div>
<main>
  <div class="box" id="boks">
    <h1>Henter ordren din …</h1>
    <div class="spinner"></div>
    <p>Dette tar bare noen sekunder.</p>
  </div>
</main>
<footer><a href="./">Tilbake til forsiden</a></footer>
<script>
(function(){
  var boks=document.getElementById('boks');
  var q=new URLSearchParams(location.search), ordre=q.get('ordre')||'', k=q.get('k')||'';
  var forsok=0, feilPaRad=0, privat=null, startet=Date.now(), timer=null;
  // Siden kan ikke vite at kunden har betalt før banken viser betalingen. Fram til da er det én tilstand,
  // «ikke registrert ennå», som vises på to måter: betalingsstegene, eller «Vi ser etter betalingen din» når
  // kunden kommer tilbake til siden etter å ha trykket «Åpne Vipps» eller kopiert nummeret. Da har de mest
  // sannsynlig betalt, og stegene med «Åpne Vipps» øverst kunne fått dem til å betale igjen. Teksten sier
  // «Har du betalt …», så den stemmer også for den som ikke betalte, og stegene er ett trykk unna.
  // Huskes om siden lastes på nytt.
  var betaltNokkel='vj_betalt_'+ordre, venterFra=0, forlot=false;
  // Når betalingsstegene ble vist (ved start, eller etter «Vis betalingen»). Etter 5 minutter sier linjen
  // nederst «Venter fortsatt på betalingen».
  var stegFra=Date.now(), FORTSATT=5*60000, venterTimer=null;
  try{ venterFra=Number(sessionStorage.getItem(betaltNokkel)||0); }catch(e){}
  function vis(html){ boks.innerHTML=html; }
  // Vipps bedrift: kunden har betalt inne i Vipps og kommer tilbake hit. Vipps privat: kunden har ikke betalt ennå.
  if(q.get('retur')==='vipps'){ var h=boks.querySelector('h1'); if(h) h.textContent='Sjekker betalingen …'; }
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

  function visBetalt(d){
    clearTimeout(timer);
    boks.className='box';
    vis('<h1>Takk for kjøpet! 🎄</h1><p>Betalingen er godkjent. Ordrenummer <b>'+esc(ordre)+'</b>.</p>'+
      (d.token?'<a class="btn" href="last-ned.html?t='+encodeURIComponent(d.token)+'">Last ned heftet</a>':'')+
      '<p style="margin-top:18px">Vi har også sendt nedlastingslenken til <b>'+esc(d.epost||'e-posten din')+'</b>. Sjekk søppelpost hvis den ikke dukker opp.</p>');
  }

  // Vipps privat: kunden vippser til et mobilnummer. Boksen tegnes én gang, og siden sjekker videre i bakgrunnen.
  function visBetaling(d){
    if(privat){ return; }
    var nr=String(d.nr||'').replace(/\D/g,'');
    // Lenken lages her fra nummeret, med 47 foran, så knappen virker selv om backend ikke er oppdatert.
    d.lenke=nr.length>=8?vjVipps.https(nr):d.lenke;
    var m=vjVipps.miljo(), l=vjVipps.lenker(d.lenke), v=vjVipps.valg(m);
    var kr=d.belop+' kr';
    var naar=d.automatisk?'Siden oppdaterer seg selv når betalingen er kommet.':'Heftet kommer på e-post så snart betalingen er registrert.';
    var trinn;
    if(m.mobil){
      // Tre steg: «Åpne Vipps» først, siden den virker for de fleste. Nummeret og «Kopier» står i steg 2, der de trengs.
      trinn='<ol class="trinn">'+
        '<li class="knapp"><span class="nr">1</span><div><a class="btn vipps" id="aapne" href="'+esc(l[v.hoved])+'">Åpne Vipps</a>'+
          '<p class="under-knapp"><a class="reserve" href="'+esc(l[v.reserve])+'">Åpnet ikke Vipps?</a></p></div></li>'+
        '<li class="nummer"><span class="nr">2</span><div><b>Skriv inn '+esc(kr)+' og betal</b><small>Nummeret er fylt ut, beløpet skriver du selv. Mangler nummeret?</small>'+
          '<div class="felt"><span class="tlf">'+esc(d.mottaker)+'</span><button class="knapp-liten" type="button" id="kopier">Kopier</button></div></div></li>'+
        '<li><span class="nr">3</span><div><b>Kom tilbake hit</b><small>'+naar+'</small></div></li>'+
      '</ol>';
    } else {
      var svg=vjVipps.qrSvg(d.lenke);
      var qrTekst='Da åpnes Vipps med nummeret fylt ut. Skriv inn '+esc(kr)+' og betal'+(d.automatisk?', så dukker heftet opp her.':'. Heftet kommer på e-post når betalingen er registrert.');
      trinn=(svg?'<div class="qr">'+svg+'<div><b>Skann QR-koden med kameraet på mobilen</b><small style="display:block;color:var(--muted);margin-top:6px">'+qrTekst+'</small></div></div>':'')+
        '<ol class="trinn">'+
        '<li class="enkel"><div><b>'+(svg?'Eller betal selv i Vipps på mobilen':'Betal i Vipps på mobilen')+'</b>'+
          '<dl class="fakta"><div><dt>Mobilnummer</dt><dd><span class="tlf">'+esc(d.mottaker)+'</span><button class="knapp-liten" type="button" id="kopier">Kopier</button></dd></div>'+
          '<div><dt>Beløp</dt><dd>'+esc(kr)+'</dd></div></dl>'+
          (svg?'':'<small>'+naar+'</small>')+'</div></li>'+
      '</ol>';
    }
    var ePost='<span class="nowrap">e-post</span>';
    var kommer=d.automatisk?'Heftet dukker opp her og kommer på '+ePost+' så snart betalingen er registrert.':'Heftet kommer på '+ePost+' så snart betalingen er registrert.';
    boks.className='box betal';
    vis('<div id="betalDel"><span class="eyebrow">Ordre '+esc(d.ordre)+'</span><h1>Betal '+esc(kr)+' med Vipps</h1>'+
      '<p class="ingress">Heftet kommer her og på e-post når betalingen er registrert. Betal fra <span class="nowrap">Vipps-kontoen</span> til <b class="nowrap" id="fraNavn">'+esc(d.navn)+'</b>, så finner vi betalingen.</p>'+trinn+'</div>'+
      '<div id="venteDel" class="sjekker" hidden><span class="eyebrow">Ordre '+esc(d.ordre)+'</span>'+
        '<div class="radar" aria-hidden="true"><span></span></div>'+
        '<h1 role="status">Vi ser etter betalingen din</h1>'+
        '<p class="ingress">Har du betalt, er du ferdig og trenger ikke betale igjen.</p>'+
        '<dl class="fakta vente-kort"><div><dt>Beløp</dt><dd>'+esc(kr)+'</dd></div><div><dt>Til</dt><dd>'+esc(d.mottaker)+'</dd></div>'+
          '<div><dt>Fra</dt><dd><span id="venteNavn">'+esc(d.navn)+'</span><button type="button" class="knapp-liten" id="venteEndre" aria-expanded="false">Endre</button></dd></div></dl></div>'+
      '<p class="fra" id="fra">'+
        '<button type="button" class="annen" id="endre" aria-expanded="false" aria-controls="nyttNavn">Betaler du fra en annens Vipps?</button></p>'+
      '<form class="nytt-navn" id="nyttNavn" hidden><input id="navnFelt" autocomplete="off" placeholder="Fullt navn på Vipps-kontoen" maxlength="80" required>'+
        '<button class="btn" type="submit">Lagre</button></form><p class="liten-feil" id="navnFeil" hidden></p>'+
      '<p class="venter" id="venter" role="status"><span class="venter-prikk" aria-hidden="true"></span><span id="venterTekst">Venter på betalingen</span></p>'+
      '<div id="venteBunn" hidden><p class="vente-tekst">'+kommer+'</p>'+
        '<div class="vente-hjelp" id="venteHjelp" hidden><b>Tar det lang tid?</b>Sjekk i Vipps at du betalte '+esc(kr)+' til <span class="nowrap">'+esc(d.mottaker)+'</span>. '+
          'Brukte du en annens Vipps, trykk «Endre». Ellers kan du skrive til <a href="mailto:'+VJ_KONTAKT+'">'+VJ_KONTAKT+'</a> med ordrenummeret.</div>'+
        '<p class="tilbake-rad">Har du ikke betalt ennå?<br><button class="lenkeknapp" type="button" id="visBetaling">Vis betalingen</button></p></div>'+

      '<p class="liten-feil" id="sjekkFeil" hidden></p>');
    privat=d; // først når boksen faktisk er tegnet
    document.getElementById('visBetaling').onclick=function(){
      venterFra=0; try{ sessionStorage.removeItem(betaltNokkel); }catch(e){}
      stegFra=Date.now(); visModus(); window.scrollTo(0,0);
    };
    var kb=document.getElementById('kopier'), kbTimer=null;
    var visKopiert=function(){
      kb.textContent='Kopiert!'; kb.classList.add('ok'); clearTimeout(kbTimer);
      kbTimer=setTimeout(function(){ kb.textContent='Kopier'; kb.classList.remove('ok'); },2500);
    };
    // «Åpne Vipps» kopierer også nummeret, i tilfelle det ikke blir fylt ut i Vipps. Går det ikke, sier vi ingenting:
    // nummeret og «Kopier» står i steg 2.
    [document.getElementById('aapne'), boks.querySelector('.reserve')].forEach(function(a){
      if(a) a.addEventListener('click',function(){
        forlot=true;
        if(kb && !kb.classList.contains('ok')) vjVipps.kopier(nr).then(visKopiert).catch(function(){});
      });
    });
    visModus();
    if(kb) kb.onclick=function(){
      forlot=true; // kopierer kunden og går til Vipps selv, regnes det som at de har vært borte
      vjVipps.kopier(nr).then(visKopiert).catch(function(){ kb.textContent='Hold inne nummeret for å kopiere'; });
    };
    // Navnefeltet åpnes fra pilen under stegene eller «Endre» på venteskjermen
    var aapent=function(ja){ ['endre','venteEndre'].forEach(function(id){ document.getElementById(id).setAttribute('aria-expanded',String(ja)); }); };
    var veksleNavn=function(){
      var f=document.getElementById('nyttNavn'); f.hidden=!f.hidden;
      aapent(!f.hidden);
      if(!f.hidden) document.getElementById('navnFelt').focus();
    };
    document.getElementById('endre').onclick=veksleNavn;
    document.getElementById('venteEndre').onclick=veksleNavn;
    document.getElementById('nyttNavn').onsubmit=function(e){
      e.preventDefault();
      var felt=document.getElementById('navnFelt'), feil=document.getElementById('navnFeil');
      vjPost({action:'navn',ordre:ordre,k:k,navn:felt.value}).then(function(r){
        if(!r.ok){ feil.textContent=r.error||'Noe gikk galt'; feil.hidden=false; return; }
        feil.hidden=true; document.getElementById('fraNavn').textContent=r.navn; document.getElementById('venteNavn').textContent=r.navn;
        document.getElementById('nyttNavn').hidden=true; aapent(false);
      }).catch(function(){ feil.textContent='Fikk ikke lagret navnet. Prøv igjen.'; feil.hidden=false; });
    };
  }

  function visVenting(){
    if(!venterFra){ venterFra=Date.now(); try{ sessionStorage.setItem(betaltNokkel,String(venterFra)); }catch(e){} }
    visModus(); window.scrollTo(0,0); planlegg(300);
  }
  function visModus(){
    var b=document.getElementById('betalDel'), v=document.getElementById('venteDel');
    if(!b||!v) return;
    b.hidden=!!venterFra; v.hidden=!venterFra;
    // Navnet står i kortet på venteskjermen, så linjen under stegene trengs bare der
    var fra=document.getElementById('fra'), bunn=document.getElementById('venteBunn'), ve=document.getElementById('venter');
    if(fra) fra.hidden=!!venterFra; if(bunn) bunn.hidden=!venterFra; if(ve) ve.hidden=!!venterFra;
    oppdaterVenter();
    var h=document.getElementById('venteHjelp'); if(h) h.hidden=!(venterFra && Date.now()-venterFra>20*60000);
  }

  // Linjen nederst under stegene: «Venter på betalingen», og «Venter fortsatt …» når stegene har stått i 5 minutter
  function oppdaterVenter(){
    var t=document.getElementById('venterTekst'); if(!t) return;
    var igjen=stegFra+FORTSATT-Date.now();
    t.textContent=igjen>0?'Venter på betalingen':'Venter fortsatt på betalingen';
    clearTimeout(venterTimer);
    if(igjen>0 && !venterFra) venterTimer=setTimeout(oppdaterVenter,igjen+100);
  }

  function planlegg(ms){ clearTimeout(timer); timer=setTimeout(sjekk,ms); }
  function sjekk(){
    // Første kall svarer med en gang. Når betalingsboksen vises, ber siden backend om å spørre banken også.
    // POST, samme vei som selve kjøpet, som vi vet kommer fram.
    var p={action:'status',ordre:ordre,k:k};
    if(privat) p.sjekk='1';
    vjPost(p).then(function(d){
      if(!d.ok) throw new Error(d.error||'Ukjent feil');
      forsok=0; feilPaRad=0;
      var sf=document.getElementById('sjekkFeil'); if(sf) sf.hidden=true;
      if(d.status==='BETALT') return visBetalt(d);
      if(d.status==='VENTER_BANK'){
        visBetaling(d); visModus();
        // Hvert 10. sekund den første timen, deretter hvert minutt. Backend spør banken høyst hvert 20. sekund.
        if(document.visibilityState!=='hidden') planlegg(Date.now()-startet<36e5?10000:60000);
        return;
      }
      if(d.status==='VENTER' && forsok++<20){ planlegg(2500); return; }
      if(d.status==='VENTER'){
        vis('<h1>Betalingen er ikke fullført ennå</h1><p>Hvis du godkjente i Vipps, kommer e-posten med lenken i løpet av få minutter.</p><a class="btn" href="javascript:location.reload()">Sjekk igjen</a>');
      } else {
        vis('<h1>Betalingen ble avbrutt</h1><p>Ingen penger er trukket. Du kan prøve igjen når du vil.</p><a class="btn" href="./#kjop">Prøv igjen</a>');
      }
    }).catch(function(e){
      var melding=e&&e.message||'ukjent';
      if(window.console) console.error('Statussjekk feilet:',melding);
      if(privat){
        // Boksen vises allerede, så kunden kan betale. Si fra hvis sjekken ikke får kontakt, og prøv videre.
        if(++feilPaRad>=2){ var sf=document.getElementById('sjekkFeil'); if(sf){ sf.textContent='Får ikke sjekket betalingen akkurat nå ('+melding+'). Heftet kommer uansett på e-post når betalingen er registrert.'; sf.hidden=false; } }
        planlegg(15000); return;
      }
      if(forsok++<6){
        var t=boks.querySelector('p'); if(t) t.textContent='Prøver igjen … ('+melding+')';
        return planlegg(2000+forsok*1000);
      }
      vis('<h1>Noe gikk galt</h1><p>Vi fikk ikke sjekket betalingen. Har du betalt, får du e-posten innen kort tid. Ellers kan du skrive til <a href="mailto:'+VJ_KONTAKT+'">'+VJ_KONTAKT+'</a> og oppgi ordrenummer '+esc(ordre)+'.</p>'+
        '<a class="btn" href="javascript:location.reload()">Prøv igjen</a>'+
        '<p style="margin-top:14px;font-size:13px;color:var(--muted)">Feilmelding: '+esc(melding)+'</p>');
    });
  }
  // Kunden kommer tilbake fra Vipps-appen: sjekk med en gang i stedet for å vente på neste runde.
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible' && privat && forlot){ forlot=false; visVenting(); return; }
    if(document.visibilityState==='visible' && privat){ planlegg(300); }
  });
  // Kommer kunden rett fra kjøpet, har forsiden lagt igjen betalingsinfoen. Da vises «Åpne Vipps» med en gang.
  var lagret=null;
  try{ lagret=JSON.parse(sessionStorage.getItem('vj_betaling_'+ordre)||'null'); }catch(e){}
  if(lagret && lagret.ordre===ordre && lagret.status==='VENTER_BANK'){
    try{ visBetaling(lagret); }catch(e){ if(window.console) console.error('Betalingsboksen feilet:',e); }
  }
  if(privat) planlegg(5000); else sjekk();
})();
</script>
</body>
</html>
